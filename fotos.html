    <h1>Galeria 360°</h1>
    <p class="sub">Clique em uma imagem para abrir em 360° / VR</p>

    Para cada imagem:
      src      = miniatura (pode ser a própria imagem 360)
      data-360 = caminho da imagem equiretangular (proporção 2:1)

  <!-- Visualizador A-Frame -->
  <div id="viewer">
    <button id="fechar">← Voltar</button>
    <div id="titulo-360"></div>

    <a-scene
      id="cena"
      embedded
      vr-mode-ui="enabled: true"
      loading-screen="enabled: false"
      renderer="antialias: true"
      style="width:100%; height:100%;">

      <a-sky id="ceu" src="" rotation="0 -90 0"></a-sky>

      <!-- Câmera com controle por mouse/toque/giroscópio e cursor por olhar (fuse) -->
      <a-entity camera look-controls position="0 1.6 0">
        <a-entity
          cursor="fuse: true; fuseTimeout: 1500"
          raycaster="objects: .clicavel"
          position="0 0 -1"
          geometry="primitive: ring; radiusInner: 0.01; radiusOuter: 0.015"
          material="color: white; shader: flat">
        </a-entity>
      </a-entity>

      <!-- Botão "Sair" dentro do VR (olhe para ele por 1,5s) -->
      <a-entity id="sair-vr" class="clicavel" position="0 -1.2 -2.5" rotation="-30 0 0">
        <a-plane width="1.2" height="0.4" color="#222" opacity="0.85"></a-plane>
        <a-text value="Sair" align="center" width="3" position="0 0 0.01"></a-text>
      </a-entity>
    </a-scene>
  </div>
